<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      color: #333;
    }

    .main_heading {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 10px 0;
      outline: none;
      font-size: 15px;
      background: #f9f9f9;
      color: #333;
    }

    input::placeholder,
    textarea::placeholder {
      color: #888;
    }

    textarea {
      resize: none;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      margin: 15px 0;
      background: #fefefe;
    }

    legend {
      padding: 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    label {
      margin-right: 15px;
    }

    input[type="submit"] {
      width: 100%;
      background: #0072ff;
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s ease;
    }

    input[type="submit"]:hover {
      background: #0056cc;
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div class="container">
    <form action="" method="get">
      <h1 class="main_heading">Payment Form</h1>
      <hr>

      <h2>User Information</h2>
      <p>Required Fields are followed by *</p>

      <p>Name: * 
        <input type="text" required name="name" placeholder="Shivani Jatav">
      </p>

      <fieldset>
        <legend>Gender *</legend>
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female" required> Female</label>
      </fieldset>

      <p>Address: * 
        <textarea placeholder="Enter your address" name="address" required rows="5"></textarea>
      </p>

      <p>Email: * 
        <input type="email" name="email" required placeholder="jatav@gmail.com">
      </p>

      <p>Pincode: * 
        <input type="text" name="pincode" placeholder="123456" pattern="[0-9]{6}" required>
      </p>

      <h2>Payment Information</h2>
      <p>Card Type: *
        <select name="card_type" required>
          <option value="">--Select a Card Type--</option>
          <option value="visa">Visa</option>
          <option value="rupay">Rupay</option>
          <option value="mastercard">MasterCard</option>
        </select>
      </p>

      <p>Card Number: * 
        <input type="text" name="card_number" placeholder="1234123412341234" pattern="[0-9]{16}" required>
      </p>

      <p>Expiration Date: *  
        <input type="date" name="exp_date" required>
      </p>

      <p>CVV: * 
        <input type="password" name="cvv" placeholder="123" pattern="[0-9]{3}" required>
      </p>

      <input type="submit" value="Pay Now">
    </form>
  </div>
</body>
</html>
